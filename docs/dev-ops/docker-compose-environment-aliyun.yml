# Novel Agent 数据库环境配置（阿里云镜像版）
# 使用方式：docker compose -p novel-dev -f docker-compose-environment-aliyun.yml up -d
# 
# 包含服务：
# - PostgreSQL + pgvector（业务 + 向量，库 novel_vector）
# - Neo4j（知识图谱）
# - Redis（缓存 / Redisson）
# - pgAdmin（PostgreSQL 管理）
#
# 注意：此配置使用阿里云镜像仓库，国内访问速度更快
# Neo4j、PostgreSQL使用标准镜像（阿里云仓库中无此镜像或拉取超时）

services:
  # ==================== 数据库服务 ====================

  # PostgreSQL + pgvector（业务表 + 向量表）
  # 使用pgvector专用镜像，已内置pgvector扩展
  postgresql:
    image: registry.cn-hangzhou.aliyuncs.com/xfg-studio/pgvector:pg17
    container_name: novel-dev-postgresql
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: novel_vector
      PGPASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./pgvector/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - novel-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Neo4j（知识图谱）
  # 注意：使用标准镜像，阿里云仓库中无此镜像
  neo4j:
    image: neo4j:5.15.0
    container_name: novel-dev-neo4j
    restart: always
    stop_grace_period: 60s
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_http_listen__address: 0.0.0.0:7474
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
    ports:
      - "17474:7474"  # HTTP
      - "17687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - novel-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis（RAG 检索热点缓存、Redisson 限流与章节生成分布式锁）
  redis:
    image: redis:7-alpine
    container_name: novel-dev-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - novel-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== 管理工具 ====================

  # pgAdmin（PostgreSQL管理工具）
  pgadmin:
    image: registry.cn-hangzhou.aliyuncs.com/xfg-studio/pgadmin4:9.1.0
    container_name: novel-dev-pgadmin
    hostname: pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@novel.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - novel-network

volumes:
  postgresql_data:
  neo4j_data:
  neo4j_logs:
  redis_data:

networks:
  novel-network:
    driver: bridge
