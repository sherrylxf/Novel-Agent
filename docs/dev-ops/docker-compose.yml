# Novel Agent 完整Docker Compose配置（包含应用服务）
# 
# 使用方式：
# 1. 只启动数据库服务（推荐，不需要打包项目）：
#    docker compose -p novel-dev -f docker-compose-environment.yml up -d
#    或使用阿里云镜像：docker compose -p novel-dev -f docker-compose-environment-aliyun.yml up -d
#
# 2. 启动所有服务（包括应用，需要先构建镜像）：
#    docker compose -p novel-dev up -d
#    注意：启动应用前需要先构建镜像：
#    docker build -t novel-agent:1.0-SNAPSHOT -f ai-agent-station-study-app/Dockerfile ai-agent-station-study-app/
# 
# 包含所有服务：
# - PostgreSQL + pgvector（业务数据 + 向量 RAG，库 novel_vector）
# - Neo4j（知识图谱）
# - Redis（缓存 / Redisson）
# - Novel Agent应用（可选，需要先构建镜像）
#
# 注意：
# 1. 使用 docker compose（V2，不带横线）
# 2. 项目名称：novel-dev（所有服务都在此项目下）
# 3. 网络名称：novel-dev_novel-network（自动创建）

services:
  # ==================== 数据库服务 ====================

  # PostgreSQL + pgvector（业务表 + 向量表，库 novel_vector）
  postgresql:
    image: pgvector/pgvector:pg16
    container_name: novel-dev-postgresql
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: novel_vector
      PGPASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./pgvector/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - novel-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Neo4j（知识图谱）
  neo4j:
    image: neo4j:5.15.0
    container_name: novel-dev-neo4j
    restart: always
    stop_grace_period: 60s
    environment:
      # 仅对空数据目录生效；卷已存在时入口仍会尝试改密，可能与插件安装阶段冲突并刷「Neo4j is already running」——可忽略或暂时去掉本行（用已有密码连接）
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      # Neo4j 5 推荐项（替代已弃用的 dbms.connector.*）
      NEO4J_server_http_listen__address: 0.0.0.0:7474
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
    ports:
      - "17474:7474"  # HTTP
      - "17687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - novel-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis（RAG 检索热点缓存、Redisson 限流与章节生成分布式锁）
  redis:
    image: redis:7-alpine
    container_name: novel-dev-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - novel-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== AI服务 ====================
  
  # Ollama（本地Embedding模型服务）
  # 使用阿里云镜像（国内访问更快）
  ollama:
    image: registry.cn-hangzhou.aliyuncs.com/xfg-studio/ollama:0.5.10
    container_name: novel-dev-ollama
    restart: always
    ports:
      - "11434:11434"  # Ollama API端口
    volumes:
      - ollama_data:/root/.ollama  # 持久化模型数据
    environment:
      - TZ=Asia/Shanghai
    # 注意：首次启动需要手动拉取模型，执行：
    # docker exec -it novel-dev-ollama ollama pull nomic-embed-text
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - novel-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== 应用服务 ====================
  
  # Novel Agent应用
  novel-agent-app:
    image: novel-agent:1.0-SNAPSHOT
    container_name: novel-dev-app
    restart: on-failure
    ports:
      - "8091:8091"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=docker
      # PostgreSQL（业务 + 向量，服务名 postgresql）
      - SPRING_DATASOURCE_POSTGRESQL_URL=jdbc:postgresql://postgresql:5432/novel_vector
      - SPRING_DATASOURCE_POSTGRESQL_USERNAME=postgres
      - SPRING_DATASOURCE_POSTGRESQL_PASSWORD=postgres
      # Neo4j连接（使用docker-compose服务名）
      - SPRING_NEO4J_URI=bolt://neo4j:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=password
      # LLM API配置（DeepSeek）
      - SPRING_AI_OPENAI_API_KEY=${OPENAI_API_KEY:-sk-45e14e100bee45b9b935e65fca433e26}
      - SPRING_AI_OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.deepseek.com}
      # Embedding API配置（使用本地Ollama）
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-ollama}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://ollama:11434/v1}
      # Redis（与 novel-dev-redis 同网络，服务名 redis）
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT:-6379}
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgresql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - novel-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8091/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgresql_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  ollama_data:  # Ollama模型数据持久化

networks:
  novel-network:
    driver: bridge
